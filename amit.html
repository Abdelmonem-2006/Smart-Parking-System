<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, IoT World! — Device Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap%22 rel="stylesheet">
<style>
  :root{
    --bg: #0E1417;
    --panel: #161F23;
    --panel-raised: #1D272C;
    --border: #263136;
    --text: #E8EEEF;
    --text-muted: #85999E;
    --cyan: #4FD1C5;
    --amber: #F5A623;
    --danger: #F0654B;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(circle at 20% -10%, #16232699 0%, transparent 45%), var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 32px 20px 60px;
  }
  .wrap{ max-width: 760px; margin: 0 auto; }
 
  /* ---- Header ---- */
  .banner{
    background: linear-gradient(135deg, #17262A 0%, #131B1E 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 26px;
    margin-bottom: 18px;
    display:flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .banner-title{
    font-family:'Space Grotesk', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .banner-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .status-pill{
    display:flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
  }
  .dot{
    width:9px; height:9px; border-radius:50%;
    background: var(--text-muted);
    box-shadow: 0 0 0 0 rgba(79,209,197,0.6);
  }
  .status-pill.online .dot{
    background: var(--cyan);
    animation: pulse 1.6s infinite;
  }
  .status-pill.online{ color: var(--cyan); border-color:#2C4A47; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(79,209,197,0.55);}
    70%{ box-shadow: 0 0 0 8px rgba(79,209,197,0);}
    100%{ box-shadow: 0 0 0 0 rgba(79,209,197,0);}
  }
 
  /* ---- Sensor grid (temp + humidity only) ---- */
  .grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 18px;
  }
  .card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background: var(--accent, var(--cyan));
    opacity:0.9;
  }
  .card.temp{ --accent: var(--amber); }
  .card.humidity{ --accent: var(--cyan); }
  .card-label{
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .card-value{
    font-family:'IBM Plex Mono', monospace;
    font-size: 2.4rem;
    font-weight: 600;
    line-height:1;
  }
  .card-unit{ font-size:1.1rem; color: var(--text-muted); margin-left:4px; }
  .card-trend{ margin-top: 8px; font-size: 0.75rem; color: var(--text-muted); font-family:'IBM Plex Mono', monospace; }
 
  
  /* ---- Control panel ---- */
  .controls{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 22px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    flex-wrap:wrap;
    gap: 14px;
    margin-bottom: 18px;
  }
  .led-row{ display:flex; align-items:center; gap: 12px; }
  .led-indicator{
    width: 16px; height:16px; border-radius:50%;
    background:#3A2E22; border:1px solid var(--border);
    transition: all .2s ease;
  }
  .led-indicator.on{
    background: var(--amber);
    box-shadow: 0 0 14px 3px rgba(245,166,35,0.65);
  }
  button{
    font-family:'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    border: 1px solid var(--border);
    background: var(--panel-raised);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 10px;
    cursor:pointer;
    transition: all .15s ease;
  }
  button:hover{ border-color: var(--cyan); color: var(--cyan); }
  button:active{ transform: scale(0.97); }
  button.primary{ background: var(--cyan); color:#0E1417; border-color: var(--cyan); }
  button.primary:hover{ opacity:0.85; color:#0E1417; }
 
  /* ---- Event log ---- */
  .console{
    background: #0B1113;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    height: 160px;
    overflow-y:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.78rem;
  }
  .console-title{
    font-family:'Space Grotesk', sans-serif;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .console ul{ list-style:none; margin:0; padding:0; }
  .console li{ color:#9FB3B8; padding: 2px 0; white-space: pre-wrap; }
  .console li span{ color: var(--cyan); }
 
  footer{
    margin-top: 16px;
    display:flex; justify-content: space-between; flex-wrap:wrap; gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
  }
 
  @media (max-width: 560px){
    .grid{ grid-template-columns: 1fr; }
    .banner{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">
 
  <div class="banner">
    <div>
      <div class="banner-title">Hello, IoT World!</div>
      <div class="banner-sub" id="bootLine">device: esp32-lab-07 · booting…</div>
    </div>
    <div class="status-pill" id="statusPill">
      <span class="dot"></span>
      <span id="statusText">Offline</span>
    </div>
  </div>
 
  <div class="grid">
    <div class="card temp">
      <div class="card-label">Temperature</div>
      <div class="card-value"><span id="tempValue">--</span><span class="card-unit">°C</span></div>
      <div class="card-trend" id="tempTrend">awaiting first reading</div>
    </div>
    <div class="card humidity">
      <div class="card-label">Humidity</div>
      <div class="card-value"><span id="humValue">--</span><span class="card-unit">%</span></div>
      <div class="card-trend" id="humTrend">awaiting first reading</div>
    </div>
  </div>
 
  <div class="controls">
    <div class="led-row">
      <div class="led-indicator" id="ledDot"></div>
      <span id="ledLabel">LED is OFF</span>
    </div>
    <div style="display:flex; gap:10px;">
      <button id="refreshBtn">Refresh now</button>
      <button id="ledToggle" class="primary">Toggle LED</button>
    </div>
  </div>
 
  <div class="console">
    <div class="console-title">Event log</div>
    <ul id="log"></ul>
  </div>
 
  <footer>
    <span id="lastUpdated">Last updated: —</span>
    <span>Lecture 7 · Frontend Basics for IoT Web Servers</span>
  </footer>
 
</div>
 
<script>
  // ---- State ----
  let ledOn = false;
  const bootTime = new Date();
 
  // ---- DOM refs ----
  const statusPill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');
  const tempValue = document.getElementById('tempValue');
  const humValue = document.getElementById('humValue');
  const tempTrend = document.getElementById('tempTrend');
  const humTrend = document.getElementById('humTrend');
  const ledDot = document.getElementById('ledDot');
  const ledLabel = document.getElementById('ledLabel');
  const ledToggle = document.getElementById('ledToggle');
  const refreshBtn = document.getElementById('refreshBtn');
  const logList = document.getElementById('log');
  const lastUpdated = document.getElementById('lastUpdated');
  const bootLine = document.getElementById('bootLine');
 
  bootLine.textContent = `device: esp32-lab-07 · boot ${bootTime.toLocaleTimeString()}`;
 
  // ---- Event log helper ----
  function logEvent(message){
    const time = new Date().toLocaleTimeString();
    const li = document.createElement('li');
    li.innerHTML = `<span>[${time}]</span> ${message}`;
    logList.prepend(li);
    while (logList.children.length > 30) logList.removeChild(logList.lastChild);
  }
 
  // ---- Simulated fallback (used only if the ESP32 is unreachable) ----
  function setOnline(){
    statusPill.classList.add('online');
    statusText.textContent = 'Online';
  }
 
  function applyReading(data, source){
    tempValue.textContent = data.temperature;
    humValue.textContent = data.humidity;
    tempTrend.textContent = data.temperature > 27 ? 'above comfort range' : 'nominal';
    humTrend.textContent = data.humidity > 60 ? 'high' : 'nominal';
    lastUpdated.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
    setOnline();
    logEvent(`sensor data received (${source}) — ${data.temperature}°C, ${data.humidity}% humidity`);
  }
 
  function setLedUI(isOn){
    ledOn = isOn;
    ledDot.classList.toggle('on', ledOn);
    ledLabel.textContent = `LED is ${ledOn ? 'ON' : 'OFF'}`;
    ledToggle.textContent = ledOn ? 'Turn LED off' : 'Toggle LED';
  }
 
  // ---- Pull real data from the ESP32; fall back to simulator if unreachable ----
  function refreshData(){
    fetch('/api/sensors')
      .then(res => { if(!res.ok) throw new Error('bad response'); return res.json(); })
      .then(data => applyReading(data, 'device'))
      .catch(() => applyReading(getRandomReading(), 'simulated'));
  }
 
  // ---- Sync LED state from the device on load (in case it was already on) ----
  function syncLedState(){
    fetch('/api/led')
      .then(res => { if(!res.ok) throw new Error('bad response'); return res.json(); })
      .then(data => {
        setLedUI(data.led === 'on');
        logEvent(`LED state synced from device — ${data.led.toUpperCase()}`);
      })
      .catch(() => logEvent('could not sync LED state — device unreachable'));
  }
 
  // ---- LED toggle: calls the real ESP32 endpoint ----
  ledToggle.addEventListener('click', () => {
    const nextState = !ledOn;
    const endpoint = nextState ? '/led/on' : '/led/off';
    fetch(endpoint)
      .then(res => { if(!res.ok) throw new Error('bad response'); return res.text(); })
      .then(() => {
        setLedUI(nextState);
        logEvent(`LED toggled ${ledOn ? 'ON' : 'OFF'} — device confirmed`);
      })
      .catch(() => logEvent('LED command failed — device unreachable'));
  });
 
  refreshBtn.addEventListener('click', () => {
    logEvent('manual refresh requested');
    refreshData();
  });
 
  // ---- Boot sequence ----
  logEvent('booting device…');
  syncLedState();
  refreshData();
  setInterval(refreshData, 5000);
</script>
</body>
</html>
